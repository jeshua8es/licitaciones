<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Licitaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-file-contract me-2"></i>Sistema de Licitaciones
            </a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 bg-light vh-100 p-3">
                <div class="list-group">
                    <a href="index.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="ofertas.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-list-alt me-2"></i>Ofertas
                    </a>
                    <a href="importar.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-file-import me-2"></i>Importar
                    </a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-check-circle me-2"></i>Dashboard Funcional</h5>
                    </div>
                    <div class="card-body">
                        <h6>Estadísticas</h6>
                        <div class="row" id="stats">
                            <div class="col-12">
                                <div class="alert alert-info">
                                    <i class="fas fa-spinner fa-spin me-2"></i>Cargando...
                                </div>
                            </div>
                        </div>

                        <h6 class="mt-4">Últimas Ofertas</h6>
                        <div id="ofertas-table">
                            <div class="alert alert-secondary">
                                <i class="fas fa-spinner fa-spin me-2"></i>Cargando ofertas...
                            </div>
                        </div>

                        <div class="alert alert-success mt-4">
                            <p class="mb-0"><i class="fas fa-check me-2"></i>Sistema funcionando correctamente</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('http://localhost/PHP/licitacion/api.php?url=ofertas');
                const data = await response.json();

                // Calcular stats
                const total = data.length;
                const activas = data.filter(o => o.estado === 'activa').length;
                const pendientes = data.filter(o => o.estado === 'pendiente').length;
                const cerradas = data.filter(o => o.estado === 'cerrada').length;

                // Mostrar stats
                document.getElementById('stats').innerHTML = `
                    <div class="col-md-3 mb-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h6>Total</h6>
                                <h3>${total}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h6>Activas</h6>
                                <h3>${activas}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h6>Pendientes</h6>
                                <h3>${pendientes}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card bg-secondary text-white">
                            <div class="card-body">
                                <h6>Cerradas</h6>
                                <h3>${cerradas}</h3>
                            </div>
                        </div>
                    </div>
                `;

                // Mostrar tabla
                let tableHTML = '<table class="table table-sm table-hover"><thead><tr><th>ID</th><th>Título</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>';

                data.forEach(oferta => {
                    let badge = 'bg-secondary';
                    if (oferta.estado === 'activa') badge = 'bg-success';
                    if (oferta.estado === 'pendiente') badge = 'bg-warning';

                    tableHTML += `
                        <tr>
                            <td>${oferta.id}</td>
                            <td>${oferta.titulo}</td>
                            <td><span class="badge ${badge}">${oferta.estado}</span></td>
                            <td>${oferta.created_at}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                document.getElementById('ofertas-table').innerHTML = tableHTML;

            } catch (error) {
                document.getElementById('stats').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>Error: ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>

</html>
