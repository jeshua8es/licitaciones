<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-file-contract me-2"></i>Importar Datos
            </a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 bg-light vh-100 p-3">
                <div class="list-group">
                    <a href="index.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a href="ofertas.html" class="list-group-item list-group-item-action">
                        <i class="fas fa-list-alt me-2"></i>Ofertas
                    </a>
                    <a href="importar.html" class="list-group-item list-group-item-action active">
                        <i class="fas fa-file-import me-2"></i>Importar
                    </a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-file-import me-2"></i>Importar desde Archivo Plano</h5>
                    </div>
                    <div class="card-body">
                        <!-- PROCESADOR DE CSV -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h5><i class="fas fa-upload me-2"></i>1. Cargar Archivo</h5>
                                        <div class="mb-3">
                                            <label class="form-label">Seleccionar archivo CSV</label>
                                            <input type="file" class="form-control" id="archivo-csv" accept=".csv" required>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Tipo de datos</label>
                                            <select class="form-select" id="tipo-datos">
                                                <option value="ofertas">Ofertas</option>
                                                <option value="productos">Productos</option>
                                            </select>
                                        </div>

                                        <button class="btn btn-primary" onclick="procesarCSV()">
                                            <i class="fas fa-cog me-2"></i>Procesar Archivo
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h5><i class="fas fa-info-circle me-2"></i>2. Vista Previa</h5>
                                        <div id="vista-previa" class="bg-light p-3 rounded" style="height: 200px; overflow-y: auto;">
                                            <p class="text-muted mb-0">Seleccione un archivo CSV para ver vista previa...</p>
                                        </div>
                                        <div class="mt-3">
                                            <strong>Archivo:</strong> <span id="nombre-archivo" class="text-muted">Ninguno</span><br>
                                            <strong>Registros detectados:</strong> <span id="contador-registros">0</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TABLA DE DATOS PROCESADOS -->
                        <div class="card mb-4">
                            <div class="card-header bg-info text-white">
                                <h6 class="mb-0"><i class="fas fa-table me-2"></i>3. Datos a Importar</h6>
                            </div>
                            <div class="card-body">
                                <div id="tabla-datos">
                                    <div class="alert alert-secondary">
                                        <i class="fas fa-info-circle me-2"></i>Los datos procesados aparecerán aquí
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- BOTÓN DE IMPORTACIÓN -->
                        <div class="text-center">
                            <button class="btn btn-success btn-lg" id="btn-importar" onclick="importarDatos()" disabled>
                                <i class="fas fa-database me-2"></i>Importar a Base de Datos
                            </button>
                            <div class="mt-2">
                                <small class="text-muted">Se importarán <span id="total-importar">0</span> registros</small>
                            </div>
                        </div>

                        <!-- RESULTADOS -->
                        <div class="mt-4" id="resultados-importacion"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = 'http://localhost/PHP/licitacion/api.php';
        let datosProcesados = [];

        // PROCESAR CSV
        async function procesarCSV() {
            const archivo = document.getElementById('archivo-csv').files[0];
            if (!archivo) {
                alert('Por favor seleccione un archivo CSV');
                return;
            }

            document.getElementById('nombre-archivo').textContent = archivo.name;

            try {
                const texto = await archivo.text();
                const lineas = texto.split('\n').filter(line => line.trim() !== '');

                if (lineas.length < 2) {
                    alert('El archivo CSV debe tener al menos encabezado y una fila de datos');
                    return;
                }

                const encabezados = lineas[0].split(',').map(h => h.trim().replace(/"/g, ''));
                const registros = [];

                for (let i = 1; i < lineas.length; i++) {
                    const valores = parseCSVLine(lineas[i]);
                    if (valores.length === encabezados.length) {
                        const registro = {};
                        encabezados.forEach((header, index) => {
                            registro[header] = valores[index].trim().replace(/"/g, '');
                        });
                        registros.push(registro);
                    }
                }

                datosProcesados = registros;

                // Actualizar UI
                document.getElementById('contador-registros').textContent = registros.length;
                document.getElementById('total-importar').textContent = registros.length;
                document.getElementById('btn-importar').disabled = false;

                // Vista previa
                let vista = `<strong>Encabezados:</strong> ${encabezados.join(', ')}<br><br>`;
                vista += `<strong>Primeros 3 registros:</strong><br>`;
                registros.slice(0, 3).forEach((reg, i) => {
                    vista += `${i+1}. ${JSON.stringify(reg)}<br>`;
                });
                if (registros.length > 3) {
                    vista += `<br>... y ${registros.length - 3} más`;
                }
                document.getElementById('vista-previa').innerHTML = vista;

                // Mostrar tabla
                mostrarTablaDatos(registros);

            } catch (error) {
                alert('Error al procesar CSV: ' + error.message);
            }
        }

        function parseCSVLine(line) {
            const resultado = [];
            let enComillas = false;
            let campoActual = '';

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const siguienteChar = line[i + 1] || '';

                if (char === '"' && siguienteChar === '"') {
                    campoActual += '"';
                    i++; // Saltar siguiente comilla
                } else if (char === '"') {
                    enComillas = !enComillas;
                } else if (char === ',' && !enComillas) {
                    resultado.push(campoActual);
                    campoActual = '';
                } else {
                    campoActual += char;
                }
            }

            resultado.push(campoActual);
            return resultado;
        }

        function mostrarTablaDatos(registros) {
            if (registros.length === 0) {
                document.getElementById('tabla-datos').innerHTML = `
                    <div class="alert alert-warning">
                        No hay datos para mostrar
                    </div>
                `;
                return;
            }

            const encabezados = Object.keys(registros[0]);
            let html = `
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <tr>
                                ${encabezados.map(h => `<th>${h}</th>`).join('')}
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            registros.forEach((registro, index) => {
                html += `
                    <tr>
                        ${encabezados.map(h => `<td>${registro[h] || ''}</td>`).join('')}
                        <td><span class="badge bg-success">✓ Válido</span></td>
                    </tr>
                `;
            });
            
            html += `</tbody></table></div>`;
            document.getElementById('tabla-datos').innerHTML = html;
        }
        
        // IMPORTAR A BD
        async function importarDatos() {
            const tipo = document.getElementById('tipo-datos').value;
            
            if (datosProcesados.length === 0) {
                alert('No hay datos para importar');
                return;
            }
            
            if (!confirm(`¿Importar ${datosProcesados.length} registros de ${tipo}?`)) {
                return;
            }
            
            // Mostrar carga
            document.getElementById('resultados-importacion').innerHTML = `
                <div class="alert alert-info">
                    <div class="d-flex align-items-center">
                        <div class="spinner-border spinner-border-sm me-3"></div>
                        <div>
                            <strong>Importando datos...</strong>
                            <div class="small">Procesando ${datosProcesados.length} registros</div>
                        </div>
                    </div>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}?url=importar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: tipo,
                        registros: datosProcesados
                    })
                });
                
                const resultado = await response.json();
                
                if (resultado.success) {
                    document.getElementById('resultados-importacion').innerHTML = `
                        <div class="alert alert-success">
                            <h5><i class="fas fa-check-circle me-2"></i>Importación Exitosa</h5>
                            <p><strong>Tipo:</strong> ${resultado.tipo}</p>
                            <p><strong>Total registros:</strong> ${resultado.total}</p>
                            <p><strong>Importados:</strong> ${resultado.importados}</p>
                            ${resultado.errores.length > 0 ? `
                                <div class="mt-3">
                                    <h6>Errores:</h6>
                                    <ul class="mb-0">
                                        ${resultado.errores.map(e => `<li>${e}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            <div class="mt-3">
                                <button class="btn btn-sm btn-primary" onclick="window.location.href='ofertas.html'">
                                    <i class="fas fa-eye me-1"></i>Ver datos importados
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // Deshabilitar botón
                    document.getElementById('btn-importar').disabled = true;
                    
                } else {
                    document.getElementById('resultados-importacion').innerHTML = `
                        <div class="alert alert-danger">
                            <h5><i class="fas fa-exclamation-triangle me-2"></i>Error en Importación</h5>
                            <p>${resultado.error || 'Error desconocido'}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                document.getElementById('resultados-importacion').innerHTML = `
                    <div class="alert alert-danger">
                        <h5><i class="fas fa-exclamation-triangle me-2"></i>Error de Conexión</h5>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        // EVENT LISTENER PARA CAMBIO DE ARCHIVO
        document.getElementById('archivo-csv').addEventListener('change', function() {
            if (this.files.length > 0) {
                procesarCSV();
            }
        });
    </script>
</body>

</html>
